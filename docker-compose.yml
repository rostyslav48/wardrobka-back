services:
  postgresDb:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: wardrobe_assistant
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq
    ports:
      - '${RMQ_HOST_PORT:-5672}:5672'
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: ./apps/wardrobe/DockerFile
      target: development
    command: npm run db:bootstrap
    env_file:
      - ./libs/common/src/database/.env
    environment:
      # typeOrm.config.ts (used by both the bootstrap script and the
      # migration CLI) reads POSTGRES_HOST, not POSTGRES_DOCKER_HOST — this
      # override is what points it at the compose network instead of
      # localhost.
      POSTGRES_HOST: postgresDb
      # POSTGRES_PORT comes from the same .env, where it is the *host* port so
      # that processes running outside compose can reach Postgres. Inside the
      # compose network the server always listens on 5432, so the host value
      # has to be overridden here or the parallel lanes (which rewrite that
      # .env to 5441, 5442, ...) fail to connect with ECONNREFUSED.
      POSTGRES_PORT: 5432
    depends_on:
      postgresDb:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  wardrobe-api-gateway:
    build:
      context: .
      dockerfile: ./apps/wardrobe-api-gateway/DockerFile
      target: development
    command: npm run start:dev wardrobe-api-gateway
    env_file:
      - ./apps/wardrobe-api-gateway/.env
      - ./libs/common/src/jwt/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - '${API_HOST_PORT:-3000}:3000'

  wardrobe:
    build:
      context: .
      dockerfile: ./apps/wardrobe/DockerFile
      target: development
    command: npm run start:dev wardrobe
    env_file:
      - ./apps/wardrobe/.env
      - ./libs/common/src/database/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgresDb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      wardrobe-api-gateway:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  auth:
    build:
      context: .
      dockerfile: ./apps/auth/DockerFile
      target: development
    command: npm run start:dev auth
    env_file:
      - ./apps/auth/.env
      - ./libs/common/src/database/.env
      - ./libs/common/src/jwt/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgresDb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      wardrobe-api-gateway:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  media-storage:
    build:
      context: .
      dockerfile: ./apps/media-storage/DockerFile
      target: development
    command: npm run start:dev media-storage
    env_file:
      - ./apps/media-storage/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      wardrobe-api-gateway:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  ai-assistant:
    build:
      context: .
      dockerfile: ./apps/ai-assistant/DockerFile
      target: development
    command: npm run start:dev ai-assistant
    env_file:
      - ./apps/ai-assistant/.env
      - ./libs/common/src/database/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgresDb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      wardrobe-api-gateway:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

  logger:
    build:
      context: .
      dockerfile: ./apps/logger/DockerFile
      target: development
    command: npm run start:dev logger
    env_file:
      - ./apps/logger/.env
      - ./libs/common/src/database/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgresDb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      wardrobe-api-gateway:
        condition: service_started
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

volumes:
  postgres_data:
